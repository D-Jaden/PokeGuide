<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokéguide - Catch 'Em All!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" type="image/x-icon" href="./pokeball.webp" />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">POKÉGUIDE</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search by name or ID..." class="search-input">
                <button id="searchBtn" class="search-btn">GO</button>
            </div>
            <button id="randomBtn" class="random-btn">
                <span class="random-icon"></span> RANDOM
            </button>
        </div>
    </header>

    <nav class="generation-filter">
        <div class="container">
            <span class="filter-label">GEN:</span>
            <button class="gen-btn active" data-gen="all">All</button>
            <button class="gen-btn" data-gen="1">I</button>
            <button class="gen-btn" data-gen="2">II</button>
            <button class="gen-btn" data-gen="3">III</button>
            <button class="gen-btn" data-gen="4">IV</button>
            <button class="gen-btn" data-gen="5">V</button>
            <button class="gen-btn" data-gen="6">VI</button>
            <button class="gen-btn" data-gen="7">VII</button>
            <button class="gen-btn" data-gen="8">VIII</button>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <h2 class="pokemon-title">ALL POKÉMON</h2>
            <div class="pokemon-grid" id="pokemonGrid">
                <div class="loading">Loading Pokémon...</div>
            </div>
        </div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
